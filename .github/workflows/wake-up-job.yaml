name: Periodic Wake Up Task
on:
  schedule:
    # Runs at 00:00 every day (UTC)
    - cron: '37 4,8,12,16,20 * * *'
  workflow_dispatch: # Allows you to also run it manually from the UI

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: wake up script
        run: curl -v https://s2app-4h.onrender.com